name: Deploy on merge

on:
  push:
    branches:
      - main
  # Construye la imagen en cada PR para detectar a tiempo un Dockerfile roto.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-{0}', github.ref) || 'deploy-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build

  deploy:
    # Solo main: un «Run workflow» lanzado desde otra rama no debe desplegarla.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy with docker compose
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$HOME/.env" ]; then
            set -a
            . "$HOME/.env"
            set +a
          else
            echo "WARN: $HOME/.env no existe"
          fi
          docker compose up -d --build --remove-orphans
          docker builder prune -f --filter until=72h || echo "WARN: docker builder prune falló"
          docker image prune -f || echo "WARN: docker image prune falló"
